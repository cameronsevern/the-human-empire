<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Georgia, 'Noto Serif', serif">
<defs>
<!-- paper: fine grain plus slow blotches -->
<filter id="paper" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3" result="grain"/>
<feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.9 -0.42" result="g2"/>
<feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="8" result="blot"/>
<feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0.55 -0.2" result="b2"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="b2"/><feMergeNode in="g2"/></feMerge>
</filter>
<!-- ink: a slight wobble in every line, a soft bleed of colour under it, and mottling inside the washes -->
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G" result="drawn"/>
<feGaussianBlur in="drawn" stdDeviation="7" result="bleed0"/>
<feComponentTransfer in="bleed0" result="bleed"><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
<feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11" result="wash"/>
<feColorMatrix in="wash" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0.75 -0.3" result="w2"/>
<feComposite in="w2" in2="drawn" operator="in" result="mottle"/>
<feMorphology in="drawn" operator="erode" radius="2.5" result="inner"/>
<feComposite in="drawn" in2="inner" operator="out" result="rim0"/>
<feColorMatrix in="rim0" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0.16 0" result="rim"/>
<feOffset in="drawn" dx="5" dy="7" result="off"/>
<feGaussianBlur in="off" stdDeviation="5" result="sh0"/>
<feColorMatrix in="sh0" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.22 0" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="bleed"/><feMergeNode in="drawn"/><feMergeNode in="mottle"/><feMergeNode in="rim"/></feMerge>
</filter>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#6b4a2a" stop-opacity="0"/><stop offset="100%" stop-color="#6b4a2a" stop-opacity="0.22"/></radialGradient>
</defs>
<rect width="1200" height="760" fill="#faf6ee" filter="url(#paper)"/>
<rect width="1200" height="760" fill="url(#vig)"/>
<rect x="14" y="14" width="1172" height="732" fill="none" stroke="#2f2a26" stroke-width="2"/>
<rect x="20" y="20" width="1160" height="720" fill="none" stroke="#2f2a26" stroke-width="0.7"/>
<text x="44" y="64" font-size="30" font-weight="bold" fill="#2f2a26" letter-spacing="3">THE LAYERED BOW</text>
<line x1="44" y1="76" x2="104" y2="76" stroke="#b5523b" stroke-width="3"/>
<text x="44" y="104" font-size="20" font-style="italic" fill="#8a8178">about 2,200 years ago</text>
<g filter="url(#ink)">
<path d="M 240,150 C 272,180 272,204 250,232 C 176,300 176,540 250,608 C 272,636 272,660 240,690" fill="none" stroke="#2f2a26" stroke-width="19" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 240,150 C 272,180 272,204 250,232 C 176,300 176,540 250,608 C 272,636 272,660 240,690" fill="none" stroke="#c9a56b" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
<line x1="256" y1="160" x2="256" y2="680" stroke="#2f2a26" stroke-width="2" stroke-linecap="round"/>
<path d="M 196,395 L 196,445" fill="none" stroke="#b5523b" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="800" cy="330" r="150" fill="#ffffff" stroke="#2f2a26" stroke-width="2.5"/>
<rect x="710" y="250" width="42" height="160" fill="#d8b995" stroke="#2f2a26" stroke-width="2.5"/>
<rect x="752" y="250" width="78" height="160" fill="#e6d6b8" stroke="#2f2a26" stroke-width="2.5"/>
<rect x="830" y="250" width="60" height="160" fill="#6b5a4a" stroke="#2f2a26" stroke-width="2.5"/>
<line x1="790" y1="330" x2="900" y2="130" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="790" cy="330" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="900" cy="130" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="860" y1="372" x2="1150" y2="600" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="860" cy="372" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="1150" cy="600" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="731" y1="300" x2="570" y2="170" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="731" cy="300" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="570" cy="170" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="246" y1="160" x2="400" y2="330" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="246" cy="160" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="400" cy="330" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="200" y1="420" x2="400" y2="560" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="200" cy="420" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="400" cy="560" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
</g>
<text x="731" y="438" text-anchor="middle" font-size="17" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">target side</text>
<text x="868" y="438" text-anchor="middle" font-size="17" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">archer's side</text>
<text x="800" y="516" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">Cut through one limb</text>
<text x="900" y="137" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="930" y="137" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A thin core of wood</text>
<text x="1150" y="607" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="1120" y="607" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Horn on the archer's side</text>
<text x="1120" y="634" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">can take the squeezing</text>
<text x="570" y="177" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="540" y="177" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Sinew on the far side</text>
<text x="540" y="204" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">stretches and springs back</text>
<text x="400" y="337" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="430" y="337" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The tips curve away</text>
<text x="430" y="364" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">from the archer</text>
<text x="400" y="567" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="430" y="567" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Short enough to swing</text>
<text x="430" y="594" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">across a horse's neck</text>
</svg>