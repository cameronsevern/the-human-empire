<line x1="529.8158153761766" y1="455.6497603366616" x2="395.7625248409612" y2="525.1531077141881" stroke="#b5523b" stroke-width="9" stroke-linecap="round"/>
<line x1="526.3817833501746" y1="434.9191034958976" x2="377.0773505818322" y2="412.3539454923842" stroke="#b5523b" stroke-width="9" stroke-linecap="round"/>
<line x1="535.7887674432482" y1="416.12917642638024" x2="428.26241108826207" y2="310.1146364376573" stroke="#b5523b" stroke-width="9" stroke-linecap="round"/>
<line x1="554.4436194634729" y1="406.4570926225334" x2="529.7667529630146" y2="257.4871216226082" stroke="#b5523b" stroke-width="9" stroke-linecap="round"/>
<line x1="575.2208199942227" y1="409.59725935538916" x2="642.8191676156235" y2="274.573322963147" stroke="#b5523b" stroke-width="9" stroke-linecap="round"/>
<line x1="590.1841846238234" y1="424.3502396633384" x2="724.2374751590388" y2="354.846892285812" stroke="#b5523b" stroke-width="9" stroke-linecap="round"/>
<circle cx="560" cy="440" r="40" fill="#e6d6b8" stroke="#2f2a26" stroke-width="3"/>
<circle cx="560" cy="440" r="14" fill="#faf6ee" stroke="#2f2a26" stroke-width="3"/>
<line x1="627.0361845781846" y1="267.5727690960631" x2="647.8247997900938" y2="243.75575284398798" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/>
<circle cx="990" cy="560" r="95" fill="#e6d6b8" stroke="#2f2a26" stroke-width="3"/>
<line x1="960" y1="470" x2="960" y2="650" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1020" y1="470" x2="1020" y2="650" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="902" y1="525" x2="1078" y2="525" stroke="#2f2a26" stroke-width="5" stroke-linecap="round"/>
<line x1="902" y1="595" x2="1078" y2="595" stroke="#2f2a26" stroke-width="5" stroke-linecap="round"/>
<circle cx="990" cy="560" r="13" fill="#faf6ee" stroke="#2f2a26" stroke-width="3"/>
<line x1="590" y1="415" x2="830" y2="150" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="590" cy="415" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="830" cy="150" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="440" y1="480" x2="60" y2="560" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="440" cy="480" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
