<text x="745" y="474" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">书</text>
<text x="683" y="324" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">听</text>
<text x="683" y="354" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">毛</text>
<text x="683" y="384" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">主</text>
<text x="683" y="414" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">席</text>
<text x="683" y="444" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">的</text>
<text x="683" y="474" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">话</text>
<text x="621" y="324" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">照</text>
<text x="621" y="354" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">毛</text>
<text x="621" y="384" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">主</text>
<text x="621" y="414" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">席</text>
