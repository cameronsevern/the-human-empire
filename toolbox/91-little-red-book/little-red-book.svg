</g>
<text x="282.0" y="342" text-anchor="middle" font-size="40" fill="#d6b04a" font-family="Noto Serif CJK TC, Noto Sans CJK TC, serif" font-weight="bold" letter-spacing="2">毛主席语录</text>
<text x="745" y="324" text-anchor="middle" font-size="26" fill="#2f2a26" font-family="Noto Serif CJK TC, serif" font-weight="900">读</text>
