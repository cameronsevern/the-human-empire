<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Georgia, 'Noto Serif', serif">
<defs>
<!-- paper: fine grain plus slow blotches -->
<filter id="paper" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3" result="grain"/>
<feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.9 -0.42" result="g2"/>
<feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="8" result="blot"/>
<feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0.55 -0.2" result="b2"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="b2"/><feMergeNode in="g2"/></feMerge>
</filter>
<!-- ink: a slight wobble in every line, a soft bleed of colour under it, and mottling inside the washes -->
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G" result="drawn"/>
<feGaussianBlur in="drawn" stdDeviation="7" result="bleed0"/>
<feComponentTransfer in="bleed0" result="bleed"><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
<feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11" result="wash"/>
<feColorMatrix in="wash" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0.75 -0.3" result="w2"/>
<feComposite in="w2" in2="drawn" operator="in" result="mottle"/>
<feMorphology in="drawn" operator="erode" radius="2.5" result="inner"/>
<feComposite in="drawn" in2="inner" operator="out" result="rim0"/>
<feColorMatrix in="rim0" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0.16 0" result="rim"/>
<feOffset in="drawn" dx="5" dy="7" result="off"/>
<feGaussianBlur in="off" stdDeviation="5" result="sh0"/>
<feColorMatrix in="sh0" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.22 0" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="bleed"/><feMergeNode in="drawn"/><feMergeNode in="mottle"/><feMergeNode in="rim"/></feMerge>
</filter>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#6b4a2a" stop-opacity="0"/><stop offset="100%" stop-color="#6b4a2a" stop-opacity="0.22"/></radialGradient>
</defs>
<rect width="1200" height="760" fill="#faf6ee" filter="url(#paper)"/>
<rect width="1200" height="760" fill="url(#vig)"/>
<rect x="14" y="14" width="1172" height="732" fill="none" stroke="#2f2a26" stroke-width="2"/>
<rect x="20" y="20" width="1160" height="720" fill="none" stroke="#2f2a26" stroke-width="0.7"/>
<text x="44" y="64" font-size="30" font-weight="bold" fill="#2f2a26" letter-spacing="3">THE CROSSBOW</text>
<line x1="44" y1="76" x2="104" y2="76" stroke="#b5523b" stroke-width="3"/>
<text x="44" y="104" font-size="20" font-style="italic" fill="#8a8178">about 2,300 years ago</text>
<g filter="url(#ink)">
<rect x="250" y="400" width="520" height="40" rx="8" fill="#e6d6b8" stroke="#2f2a26" stroke-width="3"/>
<path d="M 300,215 C 386,330 386,510 300,625" fill="none" stroke="#2f2a26" stroke-width="17" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 300,215 C 386,330 386,510 300,625" fill="none" stroke="#c9a56b" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
<line x1="302" y1="222" x2="640" y2="420" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="302" y1="618" x2="640" y2="420" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="330" y1="420" x2="636" y2="420" stroke="#2f2a26" stroke-width="4" stroke-linecap="round"/>
<path d="M 330.0,412.0 L 306.0,420.0 L 330.0,428.0 Z" fill="#b9c0c4" stroke="#2f2a26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<rect x="628" y="404" width="34" height="32" rx="4" fill="#b5523b" stroke="#2f2a26" stroke-width="2.5"/>
<circle cx="960" cy="225" r="118" fill="#ffffff" stroke="#2f2a26" stroke-width="2.5"/>
<rect x="860" y="213" width="200" height="34" fill="#e6d6b8" stroke="#2f2a26" stroke-width="2.5"/>
<path d="M 952,213 L 952,181 L 968,181 L 968,195 L 982,195 L 982,213 Z" fill="#b5523b" stroke="#2f2a26" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="944" cy="199" r="6" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<path d="M 970,247 L 994,303 L 1008,297 L 988,247 Z" fill="#a8a070" stroke="#2f2a26" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
<line x1="352" y1="300" x2="480" y2="160" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="352" cy="300" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="480" cy="160" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="470" y1="520" x2="480" y2="690" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="470" cy="520" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="480" cy="690" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="645" y1="420" x2="800" y2="560" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="645" cy="420" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="800" cy="560" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="1000" y1="295" x2="1150" y2="470" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="1000" cy="295" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="1150" cy="470" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="400" y1="420" x2="120" y2="690" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="400" cy="420" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="120" cy="690" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
</g>
<text x="960" y="383" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">The lock, from the side</text>
<text x="480" y="167" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="510" y="167" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A short, stiff bow fixed</text>
<text x="510" y="194" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">across a wooden stock</text>
<text x="480" y="697" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="510" y="697" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The string is drawn back with</text>
<text x="510" y="724" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">the whole body, and hooked</text>
<text x="800" y="567" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="830" y="567" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A bronze catch holds it,</text>
<text x="830" y="594" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">so the archer can</text>
<text x="830" y="621" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">wait and aim</text>
<text x="1150" y="477" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="1120" y="477" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Squeezing the trigger</text>
<text x="1120" y="504" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">lets the string go</text>
<text x="120" y="697" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="150" y="697" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A short bolt lies</text>
<text x="150" y="724" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">in a groove</text>
</svg>