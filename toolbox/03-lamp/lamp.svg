<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Georgia, 'Noto Serif', serif">
<defs>
<!-- paper: fine grain plus slow blotches -->
<filter id="paper" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3" result="grain"/>
<feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.9 -0.42" result="g2"/>
<feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="8" result="blot"/>
<feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0.55 -0.2" result="b2"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="b2"/><feMergeNode in="g2"/></feMerge>
</filter>
<!-- ink: a slight wobble in every line, a soft bleed of colour under it, and mottling inside the washes -->
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G" result="drawn"/>
<feGaussianBlur in="drawn" stdDeviation="7" result="bleed0"/>
<feComponentTransfer in="bleed0" result="bleed"><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
<feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11" result="wash"/>
<feColorMatrix in="wash" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0.75 -0.3" result="w2"/>
<feComposite in="w2" in2="drawn" operator="in" result="mottle"/>
<feMorphology in="drawn" operator="erode" radius="2.5" result="inner"/>
<feComposite in="drawn" in2="inner" operator="out" result="rim0"/>
<feColorMatrix in="rim0" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0.16 0" result="rim"/>
<feOffset in="drawn" dx="5" dy="7" result="off"/>
<feGaussianBlur in="off" stdDeviation="5" result="sh0"/>
<feColorMatrix in="sh0" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.22 0" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="bleed"/><feMergeNode in="drawn"/><feMergeNode in="mottle"/><feMergeNode in="rim"/></feMerge>
</filter>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#6b4a2a" stop-opacity="0"/><stop offset="100%" stop-color="#6b4a2a" stop-opacity="0.22"/></radialGradient>
</defs>
<rect width="1200" height="760" fill="#faf6ee" filter="url(#paper)"/>
<rect width="1200" height="760" fill="url(#vig)"/>
<rect x="14" y="14" width="1172" height="732" fill="none" stroke="#2f2a26" stroke-width="2"/>
<rect x="20" y="20" width="1160" height="720" fill="none" stroke="#2f2a26" stroke-width="0.7"/>
<text x="44" y="64" font-size="30" font-weight="bold" fill="#2f2a26" letter-spacing="3">THE LAMP</text>
<line x1="44" y1="76" x2="104" y2="76" stroke="#b5523b" stroke-width="3"/>
<text x="44" y="104" font-size="20" font-style="italic" fill="#8a8178">more than 20,000 years ago</text>
<g filter="url(#ink)">
<path d="M 260,470 C 260,400 400,360 520,360 C 660,360 750,390 770,440 L 940,450 L 940,510 L 770,520 C 720,590 600,610 520,610 C 380,610 260,550 260,470 Z" fill="#cdc6ba" stroke="#2f2a26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<ellipse cx="510" cy="470" rx="170" ry="70" fill="#f3e3a8" stroke="#2f2a26" stroke-width="3" transform="rotate(0 510 470)"/>
<path d="M 460,480 C 480,460 500,465 520,450" fill="none" stroke="#b5523b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 520,448 C 492,400 526,360 524,320 C 554,360 550,410 520,448 Z" fill="#f1b24a" stroke="#2f2a26" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
<line x1="290" y1="510" x2="120" y2="640" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="290" cy="510" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="120" cy="640" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="610" y1="490" x2="560" y2="660" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="610" cy="490" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="560" cy="660" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="480" y1="472" x2="330" y2="250" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="480" cy="472" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="330" cy="250" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="530" y1="360" x2="640" y2="200" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="530" cy="360" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="640" cy="200" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="900" y1="480" x2="1080" y2="560" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="900" cy="480" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="1080" cy="560" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
</g>
<text x="120" y="647" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="150" y="647" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A hollow ground into</text>
<text x="150" y="674" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">a slab of stone</text>
<text x="560" y="667" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="590" y="667" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Animal fat. It melts</text>
<text x="590" y="694" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">as the stone warms</text>
<text x="330" y="257" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="300" y="257" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A wick of moss or</text>
<text x="300" y="284" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">a juniper twig</text>
<text x="640" y="207" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="670" y="207" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A steady flame, about</text>
<text x="670" y="234" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">as bright as a candle</text>
<text x="1080" y="567" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="1050" y="567" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A handle that</text>
<text x="1050" y="594" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">stays cool</text>
</svg>