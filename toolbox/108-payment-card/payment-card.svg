<text x="150" y="446" font-size="27" fill="#f4f1ea" font-family="DejaVu Sans Mono, monospace" letter-spacing="1">4000 1234 5678 9010</text>
<text x="150" y="480" font-size="16" fill="#f4f1ea" font-family="DejaVu Sans Mono, monospace">VALID 09/29   A N OTHER</text>
<text x="310" y="558.2" text-anchor="middle" font-size="18" fill="#8a8178" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">a card, 85.6 by 54 mm</text>
<text x="135" y="638" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#efe6d0" stroke-width="7" paint-order="stroke" stroke-linejoin="round">the shop's</text>
<text x="135" y="665" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#efe6d0" stroke-width="7" paint-order="stroke" stroke-linejoin="round">terminal</text>
<text x="425" y="638" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#efe6d0" stroke-width="7" paint-order="stroke" stroke-linejoin="round">the shop's</text>
<text x="425" y="665" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#efe6d0" stroke-width="7" paint-order="stroke" stroke-linejoin="round">bank</text>
<text x="715" y="638" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#efe6d0" stroke-width="7" paint-order="stroke" stroke-linejoin="round">the card</text>
<text x="715" y="665" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#efe6d0" stroke-width="7" paint-order="stroke" stroke-linejoin="round">network</text>
<text x="1005" y="638" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#efe6d0" stroke-width="7" paint-order="stroke" stroke-linejoin="round">the cardholder's</text>
<text x="1005" y="665" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#efe6d0" stroke-width="7" paint-order="stroke" stroke-linejoin="round">bank</text>
<text x="570" y="596" text-anchor="middle" font-size="17" fill="#8a8178" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">the question goes out, the answer comes back</text>
<text x="560" y="197" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="590" y="197" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The stripe holds the number</text>
<text x="590" y="224" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">in three magnetic tracks</text>
<text x="560" y="317" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="590" y="317" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The chip works out a fresh</text>
<text x="590" y="344" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">code for every payment</text>
<text x="560" y="454" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="590" y="454" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The first digits name</text>
<text x="590" y="481" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">the bank that issued it</text>
<text x="700" y="721" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="670" y="721" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The network routes the question to that bank</text>
<text x="1150" y="527" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="1120" y="527" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The cardholder's bank</text>
<text x="1120" y="554" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">says yes or no</text>
</svg>