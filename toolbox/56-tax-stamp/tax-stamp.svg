<text x="600" y="496" text-anchor="middle" font-size="16" fill="#9c8f78" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">II SHILLINGS VI PENCE</text>
<text x="600" y="734" text-anchor="middle" font-size="21" fill="#8a8178" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">the stamp, enlarged</text>
