<text x="400" y="157" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="430" y="157" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The mother well, sunk</text>
<text x="430" y="184" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">down to the buried water</text>
<text x="640" y="242" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="670" y="242" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A shaft every thirty metres</text>
<text x="670" y="269" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">or so, for air and for</text>
<text x="670" y="296" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">lifting out the earth</text>
<text x="520" y="647" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="550" y="647" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#efe3cc" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The tunnel slopes very gently,</text>
<text x="550" y="674" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#efe3cc" stroke-width="7" paint-order="stroke" stroke-linejoin="round">about a metre in a kilometre</text>
<text x="60" y="647" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="90" y="647" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#efe3cc" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Water seeps in from the wet</text>
<text x="90" y="674" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#efe3cc" stroke-width="7" paint-order="stroke" stroke-linejoin="round">gravel under the hills</text>
<text x="900" y="377" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="930" y="377" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The water runs out</text>
<text x="930" y="404" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">onto the plain and</text>
<text x="930" y="431" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">into the fields</text>
</svg>