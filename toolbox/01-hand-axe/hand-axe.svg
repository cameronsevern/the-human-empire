<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Georgia, 'Noto Serif', serif">
<defs>
<!-- paper: fine grain plus slow blotches -->
<filter id="paper" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3" result="grain"/>
<feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.9 -0.42" result="g2"/>
<feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="8" result="blot"/>
<feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0.55 -0.2" result="b2"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="b2"/><feMergeNode in="g2"/></feMerge>
</filter>
<!-- ink: a slight wobble in every line, a soft bleed of colour under it, and mottling inside the washes -->
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G" result="drawn"/>
<feGaussianBlur in="drawn" stdDeviation="7" result="bleed0"/>
<feComponentTransfer in="bleed0" result="bleed"><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
<feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11" result="wash"/>
<feColorMatrix in="wash" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0.75 -0.3" result="w2"/>
<feComposite in="w2" in2="drawn" operator="in" result="mottle"/>
<feMorphology in="drawn" operator="erode" radius="2.5" result="inner"/>
<feComposite in="drawn" in2="inner" operator="out" result="rim0"/>
<feColorMatrix in="rim0" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0.16 0" result="rim"/>
<feOffset in="drawn" dx="5" dy="7" result="off"/>
<feGaussianBlur in="off" stdDeviation="5" result="sh0"/>
<feColorMatrix in="sh0" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.22 0" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="bleed"/><feMergeNode in="drawn"/><feMergeNode in="mottle"/><feMergeNode in="rim"/></feMerge>
</filter>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#6b4a2a" stop-opacity="0"/><stop offset="100%" stop-color="#6b4a2a" stop-opacity="0.22"/></radialGradient>
</defs>
<rect width="1200" height="760" fill="#faf6ee" filter="url(#paper)"/>
<rect width="1200" height="760" fill="url(#vig)"/>
<rect x="14" y="14" width="1172" height="732" fill="none" stroke="#2f2a26" stroke-width="2"/>
<rect x="20" y="20" width="1160" height="720" fill="none" stroke="#2f2a26" stroke-width="0.7"/>
<text x="44" y="64" font-size="30" font-weight="bold" fill="#2f2a26" letter-spacing="3">THE HAND AXE</text>
<line x1="44" y1="76" x2="104" y2="76" stroke="#b5523b" stroke-width="3"/>
<text x="44" y="104" font-size="20" font-style="italic" fill="#8a8178">about 1.7 million years ago</text>
<g filter="url(#ink)">
<path d="M 430,170 C 500,250 580,400 570,530 C 560,630 490,670 430,670 C 370,670 300,630 290,530 C 280,400 360,250 430,170 Z" fill="#cdc6ba" stroke="#b5523b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 430,170 C 500,250 580,400 570,530 C 560,630 490,670 430,670 C 370,670 300,630 290,530 C 280,400 360,250 430,170 Z" fill="none" stroke="#2f2a26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<line x1="430" y1="220" x2="410" y2="600" stroke="#8a8178" stroke-width="1.5" stroke-linecap="round"/>
<line x1="370" y1="360" x2="320" y2="480" stroke="#8a8178" stroke-width="1.5" stroke-linecap="round"/>
<line x1="480" y1="340" x2="535" y2="460" stroke="#8a8178" stroke-width="1.5" stroke-linecap="round"/>
<line x1="390" y1="480" x2="350" y2="590" stroke="#8a8178" stroke-width="1.5" stroke-linecap="round"/>
<line x1="460" y1="460" x2="510" y2="580" stroke="#8a8178" stroke-width="1.5" stroke-linecap="round"/>
<line x1="420" y1="300" x2="470" y2="390" stroke="#8a8178" stroke-width="1.5" stroke-linecap="round"/>
<path d="M 760,170 C 790,300 810,480 800,590 C 790,655 770,670 760,670 C 750,670 730,655 720,590 C 710,480 730,300 760,170 Z" fill="#cdc6ba" stroke="#2f2a26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="430" y1="185" x2="300" y2="160" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="430" cy="185" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="300" cy="160" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="572" y1="480" x2="560" y2="640" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="572" cy="480" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="560" cy="640" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="390" y1="660" x2="300" y2="680" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="390" cy="660" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="300" cy="680" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="490" y1="400" x2="900" y2="230" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="490" cy="400" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="900" cy="230" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="798" y1="540" x2="940" y2="560" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="798" cy="540" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="940" cy="560" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
</g>
<text x="760" y="720" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">From the side</text>
<text x="300" y="167" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="270" y="167" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A point for piercing</text>
<text x="270" y="194" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">and digging</text>
<text x="560" y="647" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="590" y="647" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Two long cutting</text>
<text x="590" y="674" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">edges</text>
<text x="300" y="687" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="270" y="687" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A rounded end that</text>
<text x="270" y="714" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">fits the palm</text>
<text x="900" y="237" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="930" y="237" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Shaped by knocking</text>
<text x="930" y="264" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">flakes off both</text>
<text x="930" y="291" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">faces of a stone</text>
<text x="940" y="567" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="970" y="567" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Thin, and the same</text>
<text x="970" y="594" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">on both sides</text>
</svg>