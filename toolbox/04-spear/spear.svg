<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Georgia, 'Noto Serif', serif">
<defs>
<!-- paper: fine grain plus slow blotches -->
<filter id="paper" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3" result="grain"/>
<feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.9 -0.42" result="g2"/>
<feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="8" result="blot"/>
<feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0.55 -0.2" result="b2"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="b2"/><feMergeNode in="g2"/></feMerge>
</filter>
<!-- ink: a slight wobble in every line, a soft bleed of colour under it, and mottling inside the washes -->
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G" result="drawn"/>
<feGaussianBlur in="drawn" stdDeviation="7" result="bleed0"/>
<feComponentTransfer in="bleed0" result="bleed"><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
<feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11" result="wash"/>
<feColorMatrix in="wash" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0.75 -0.3" result="w2"/>
<feComposite in="w2" in2="drawn" operator="in" result="mottle"/>
<feMorphology in="drawn" operator="erode" radius="2.5" result="inner"/>
<feComposite in="drawn" in2="inner" operator="out" result="rim0"/>
<feColorMatrix in="rim0" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0.16 0" result="rim"/>
<feOffset in="drawn" dx="5" dy="7" result="off"/>
<feGaussianBlur in="off" stdDeviation="5" result="sh0"/>
<feColorMatrix in="sh0" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.22 0" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="bleed"/><feMergeNode in="drawn"/><feMergeNode in="mottle"/><feMergeNode in="rim"/></feMerge>
</filter>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#6b4a2a" stop-opacity="0"/><stop offset="100%" stop-color="#6b4a2a" stop-opacity="0.22"/></radialGradient>
</defs>
<rect width="1200" height="760" fill="#faf6ee" filter="url(#paper)"/>
<rect width="1200" height="760" fill="url(#vig)"/>
<rect x="14" y="14" width="1172" height="732" fill="none" stroke="#2f2a26" stroke-width="2"/>
<rect x="20" y="20" width="1160" height="720" fill="none" stroke="#2f2a26" stroke-width="0.7"/>
<text x="44" y="64" font-size="30" font-weight="bold" fill="#2f2a26" letter-spacing="3">THE SPEAR</text>
<line x1="44" y1="76" x2="104" y2="76" stroke="#b5523b" stroke-width="3"/>
<text x="44" y="104" font-size="20" font-style="italic" fill="#8a8178">more than 400,000 years ago</text>
<g filter="url(#ink)">
<line x1="140" y1="470" x2="900" y2="470" stroke="#2f2a26" stroke-width="13" stroke-linecap="round"/>
<line x1="140" y1="470" x2="900" y2="470" stroke="#c9a56b" stroke-width="9" stroke-linecap="round"/>
<path d="M 896.0,455.0 L 980.0,470.0 L 896.0,485.0 Z" fill="#cdc6ba" stroke="#2f2a26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="880" y1="458" x2="876" y2="482" stroke="#b5523b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="871" y1="458" x2="867" y2="482" stroke="#b5523b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="862" y1="458" x2="858" y2="482" stroke="#b5523b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="853" y1="458" x2="849" y2="482" stroke="#b5523b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="844" y1="458" x2="840" y2="482" stroke="#b5523b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="140" y1="560" x2="980" y2="560" stroke="#2f2a26" stroke-width="2" stroke-linecap="round"/>
<line x1="140" y1="551" x2="140" y2="569" stroke="#2f2a26" stroke-width="2" stroke-linecap="round"/>
<line x1="980" y1="551" x2="980" y2="569" stroke="#2f2a26" stroke-width="2" stroke-linecap="round"/>
<circle cx="930" cy="250" r="130" fill="#ffffff" stroke="#2f2a26" stroke-width="2.5"/>
<rect x="820" y="236" width="120" height="28" fill="#c9a56b" stroke="#2f2a26" stroke-width="2.5"/>
<path d="M 920.0,216.0 L 1030.0,250.0 L 920.0,284.0 L 890.0,250.0 Z" fill="#cdc6ba" stroke="#2f2a26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 886,230 L 924,224 L 924,276 L 886,270 Z" fill="#5a4a40" stroke="#2f2a26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<line x1="838" y1="234" x2="834" y2="266" stroke="#b5523b" stroke-width="3" stroke-linecap="round"/>
<line x1="849" y1="234" x2="845" y2="266" stroke="#b5523b" stroke-width="3" stroke-linecap="round"/>
<line x1="860" y1="234" x2="856" y2="266" stroke="#b5523b" stroke-width="3" stroke-linecap="round"/>
<line x1="871" y1="234" x2="867" y2="266" stroke="#b5523b" stroke-width="3" stroke-linecap="round"/>
<line x1="882" y1="234" x2="878" y2="266" stroke="#b5523b" stroke-width="3" stroke-linecap="round"/>
<line x1="420" y1="470" x2="330" y2="330" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="420" cy="470" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="330" cy="330" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="980" y1="250" x2="760" y2="130" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="980" cy="250" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="760" cy="130" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="906" y1="268" x2="700" y2="330" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="906" cy="268" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="700" cy="330" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="860" y1="240" x2="640" y2="220" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="860" cy="240" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="640" cy="220" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="760" y1="470" x2="640" y2="680" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="760" cy="470" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="640" cy="680" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
</g>
<text x="560" y="592" text-anchor="middle" font-size="19" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">a little taller than the person who carries it</text>
<text x="930" y="420" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-style="italic">The point, close up</text>
<text x="330" y="337" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="300" y="337" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A straight shaft of wood,</text>
<text x="300" y="364" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">scraped smooth</text>
<text x="760" y="137" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="730" y="137" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A point of stone,</text>
<text x="730" y="164" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">added later</text>
<text x="700" y="337" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="670" y="337" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Glue of resin or tar</text>
<text x="670" y="364" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">holds it in a notch</text>
<text x="640" y="227" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="610" y="227" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Sinew is bound</text>
<text x="610" y="254" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">over the join</text>
<text x="640" y="687" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="670" y="687" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Heaviest toward the front,</text>
<text x="670" y="714" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">so that it flies point first</text>
</svg>