<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Georgia, 'Noto Serif', serif">
<defs>
<!-- paper: fine grain plus slow blotches -->
<filter id="paper" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3" result="grain"/>
<feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.9 -0.42" result="g2"/>
<feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="8" result="blot"/>
<feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0.55 -0.2" result="b2"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="b2"/><feMergeNode in="g2"/></feMerge>
</filter>
<!-- ink: a slight wobble in every line, a soft bleed of colour under it, and mottling inside the washes -->
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G" result="drawn"/>
<feGaussianBlur in="drawn" stdDeviation="7" result="bleed0"/>
<feComponentTransfer in="bleed0" result="bleed"><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
<feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11" result="wash"/>
<feColorMatrix in="wash" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0.75 -0.3" result="w2"/>
<feComposite in="w2" in2="drawn" operator="in" result="mottle"/>
<feMorphology in="drawn" operator="erode" radius="2.5" result="inner"/>
<feComposite in="drawn" in2="inner" operator="out" result="rim0"/>
<feColorMatrix in="rim0" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0.16 0" result="rim"/>
<feOffset in="drawn" dx="5" dy="7" result="off"/>
<feGaussianBlur in="off" stdDeviation="5" result="sh0"/>
<feColorMatrix in="sh0" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.22 0" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="bleed"/><feMergeNode in="drawn"/><feMergeNode in="mottle"/><feMergeNode in="rim"/></feMerge>
</filter>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#6b4a2a" stop-opacity="0"/><stop offset="100%" stop-color="#6b4a2a" stop-opacity="0.22"/></radialGradient>
</defs>
<rect width="1200" height="760" fill="#faf6ee" filter="url(#paper)"/>
<rect width="1200" height="760" fill="url(#vig)"/>
<rect x="14" y="14" width="1172" height="732" fill="none" stroke="#2f2a26" stroke-width="2"/>
<rect x="20" y="20" width="1160" height="720" fill="none" stroke="#2f2a26" stroke-width="0.7"/>
<text x="44" y="64" font-size="30" font-weight="bold" fill="#2f2a26" letter-spacing="3">THE BOW</text>
<line x1="44" y1="76" x2="104" y2="76" stroke="#b5523b" stroke-width="3"/>
<text x="44" y="104" font-size="20" font-style="italic" fill="#8a8178">more than 60,000 years ago</text>
<g filter="url(#ink)">
<path d="M 560,150 C 700,270 700,530 560,650" fill="none" stroke="#2f2a26" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 560,150 C 700,270 700,530 560,650" fill="none" stroke="#e6d6b8" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" />
<line x1="560" y1="150" x2="330" y2="400" stroke="#b5523b" stroke-width="4" stroke-linecap="round"/>
<line x1="330" y1="400" x2="560" y2="650" stroke="#b5523b" stroke-width="4" stroke-linecap="round"/>
<line x1="330" y1="400" x2="820" y2="400" stroke="#2f2a26" stroke-width="5" stroke-linecap="round"/>
<path d="M 820,388 L 862,400 L 820,412 Z" fill="#cdc6ba" stroke="#2f2a26" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
<line x1="340" y1="400" x2="326" y2="386" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="340" y1="400" x2="326" y2="414" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="354" y1="400" x2="340" y2="386" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="354" y1="400" x2="340" y2="414" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="368" y1="400" x2="354" y2="386" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="368" y1="400" x2="354" y2="414" stroke="#2f2a26" stroke-width="2.5" stroke-linecap="round"/>
<line x1="560" y1="150" x2="560" y2="650" stroke="#8a8178" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 8"/>
<line x1="650" y1="300" x2="820" y2="200" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="650" cy="300" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="820" cy="200" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="440" y1="275" x2="330" y2="170" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="440" cy="275" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="330" cy="170" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="330" y1="400" x2="290" y2="520" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="330" cy="400" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="290" cy="520" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="660" y1="520" x2="860" y2="560" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="660" cy="520" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="860" cy="560" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
<line x1="841" y1="400" x2="930" y2="310" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="841" cy="400" r="4" fill="#2f2a26" stroke="#2f2a26" stroke-width="0"/>
<circle cx="930" cy="310" r="19" fill="#faf6ee" stroke="#2f2a26" stroke-width="2"/>
</g>
<text x="820" y="207" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="850" y="207" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A stave of springy</text>
<text x="850" y="234" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">wood</text>
<text x="330" y="177" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="300" y="177" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A string of twisted</text>
<text x="300" y="204" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">sinew or plant fibre</text>
<text x="290" y="527" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="260" y="527" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Pulling the string</text>
<text x="260" y="554" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">bends the stave, and</text>
<text x="260" y="581" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">the stave stores</text>
<text x="260" y="608" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">the pull</text>
<text x="860" y="567" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="890" y="567" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Let go, and the stave</text>
<text x="890" y="594" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">springs back and</text>
<text x="890" y="621" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">throws the arrow</text>
<text x="930" y="317" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="960" y="317" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A point of stone,</text>
<text x="960" y="344" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">glued and bound</text>
</svg>