<text x="120" y="257" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">1</text>
<text x="150" y="257" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A block of stone that</text>
<text x="150" y="284" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">weighs as much as</text>
<text x="150" y="311" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">two cars</text>
<text x="150" y="697" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">2</text>
<text x="180" y="697" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#efe3c8" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A wooden sledge with</text>
<text x="180" y="724" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#efe3c8" stroke-width="7" paint-order="stroke" stroke-linejoin="round">upturned runners</text>
<text x="760" y="257" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">3</text>
<text x="790" y="257" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Ropes, and a team</text>
<text x="790" y="284" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">of about twenty</text>
<text x="470" y="197" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">4</text>
<text x="500" y="197" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Water is poured on the</text>
<text x="500" y="224" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">sand in front. Damp sand</text>
<text x="500" y="251" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">is firm, and the pull</text>
<text x="500" y="278" text-anchor="start" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round">needed is halved</text>
<text x="1090" y="687" text-anchor="middle" font-size="21" fill="#2f2a26" stroke="#faf6ee" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-weight="bold">5</text>
<text x="1060" y="687" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#efe3c8" stroke-width="7" paint-order="stroke" stroke-linejoin="round">A ramp of rubble</text>
<text x="1060" y="714" text-anchor="end" font-size="21" fill="#2f2a26" stroke="#efe3c8" stroke-width="7" paint-order="stroke" stroke-linejoin="round">and mud brick</text>
</svg>