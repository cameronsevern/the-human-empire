<line x1="962.6" y1="543" x2="1014.6" y2="557" stroke="#b5523b" stroke-width="5" stroke-linecap="round"/>
</g>
<line x1="997" y1="452" x2="1085" y2="640" stroke="#2f2a26" stroke-width="1.5" stroke-linecap="round"/>
